<!DOCTYPE html>
<html lang="PT BR">
<head>
    <meta charset="utf-8">
    <meta name = viewport'
    content="width=device-width,
    initial-scale=1.0">
    <title> meu cartão de perfil</title>
     
    <link rel="stylesheet"
    href="style.css"
</head>
<body>

    <div class="card">

        <img class="card__avatar" src="columbina.png" alt="Foto de perfil">

        <h2 class="card__name">Maria Eduarda</h2>

        <p class="card__role">Estudante</p>

        <p class="card__bio">
            Sou estudante e estou aprendendo programação.<br>
            Gosto de aprender coisas novas.
        </p>

        <ul class="card__tags">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <a class="card__btn" href="#">Entrar em contato</a>

    </div>

</body>
</html>
